<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" role="img" aria-labelledby="title desc">
  <title id="title">Armor crest shield background</title>
  <desc id="desc">Dark oxblood shield field for the Soulframe armor crest.</desc>
  <defs>
    <radialGradient id="shield-field" cx="0" cy="0" r="1" gradientTransform="translate(72 72) rotate(72) scale(97 82)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#342522"/>
      <stop offset=".55" stop-color="#271d1c"/>
      <stop offset="1" stop-color="#141212"/>
    </radialGradient>
    <linearGradient id="shield-warmth" x1="32" y1="42" x2="120" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#704c35" stop-opacity=".16"/>
      <stop offset=".42" stop-color="#4a322b" stop-opacity=".06"/>
      <stop offset="1" stop-color="#0d1010" stop-opacity=".32"/>
    </linearGradient>
    <filter id="field-shadow" x="-18%" y="-14%" width="136%" height="142%" color-interpolation-filters="sRGB">
      <feDropShadow dx="1.5" dy="3" stdDeviation="3" flood-color="#090806" flood-opacity=".82"/>
    </filter>
    <clipPath id="shield-clip">
      <path d="M80 33C65 38 56 47 32 50c-2 26-.2 51.7 8.5 71.3C49 139.5 64.4 152.7 80 163c16.5-11 31.8-24.2 40.2-42.7 8.8-19.6 10.7-45.6 7.8-70.3-22.5-3-33.2-12.3-48-17Z"/>
    </clipPath>
  </defs>
  <g transform="translate(6.4 7.2) scale(.92)">
    <path
      d="M80 33C65 38 56 47 32 50c-2 26-.2 51.7 8.5 71.3C49 139.5 64.4 152.7 80 163c16.5-11 31.8-24.2 40.2-42.7 8.8-19.6 10.7-45.6 7.8-70.3-22.5-3-33.2-12.3-48-17Z"
      fill="url(#shield-field)"
      filter="url(#field-shadow)"
    />
    <g clip-path="url(#shield-clip)">
      <rect x="26" y="28" width="108" height="141" fill="url(#shield-warmth)"/>
      <path d="M30 56c28-2 35-14 50-20 17 5 31 18 50 20" fill="none" stroke="#aa8050" stroke-width="4" opacity=".055"/>
      <path d="M38 127c22 22 38 30 43 33 18-12 29-23 39-36" fill="none" stroke="#050606" stroke-width="8" opacity=".17"/>
    </g>
  </g>
</svg>
