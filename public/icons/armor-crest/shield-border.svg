      <stop offset=".26" stop-color="#50472f"/>
      <stop offset=".52" stop-color="#695c3a"/>
      <stop offset=".76" stop-color="#3d3727"/>
      <stop offset="1" stop-color="#70613d"/>
    </linearGradient>
