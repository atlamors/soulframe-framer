<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" role="img" aria-labelledby="title desc">
  <title id="title">Soulframe advertisement frame, neutral state</title>
  <desc id="desc">A stitched rail with inner linework and folded leaf clasps at each side.</desc>
  <defs>
    <pattern id="stitch-h" width="5" height="4" patternUnits="userSpaceOnUse">
      <rect width="5" height="4" fill="#17120f"/>
      <path d="M.5.5h3v2.7h-3z" fill="#8f7953"/>
      <path d="M1 1h2.2v.6H1z" fill="#c3a978" opacity=".42"/>
    </pattern>
    <pattern id="stitch-v" width="4" height="5" patternUnits="userSpaceOnUse">
      <rect width="4" height="5" fill="#17120f"/>
      <path d="M.5.5h2.7v3h-2.7z" fill="#8f7953"/>
      <path d="M1 1h.6v2.2H1z" fill="#c3a978" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#11100f" flood-opacity=".7"/>
    </filter>
    <g id="leaf-left">
      <path d="M8.5 29 10.5 22c4.3.2 8.5 2.1 12.5 5.5L18.5 30Z" fill="#927d59" stroke="#17120f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M8.5 29 10.5 36.5c4.3-.2 8.5-2.1 12.5-5.8L18.5 28Z" fill="#927d59" stroke="#17120f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M16 29 9 24.5C5 24.5 1.8 26 .5 29c1.3 3 4.5 4.5 8.5 4.5Z" fill="#927d59" stroke="#17120f" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <rect x="7.5" y="1.5" width="285" height="247" rx="3.5" fill="none" stroke="#17120f" stroke-width="2"/>
    <rect x="9.5" y="3.5" width="281" height="243" rx="2" fill="none" stroke="#67583e"/>

    <rect x="9" y="3" width="282" height="4" fill="url(#stitch-h)"/>
    <rect x="9" y="243" width="282" height="4" fill="url(#stitch-h)"/>
    <rect x="8" y="7" width="4" height="236" fill="url(#stitch-v)"/>
    <rect x="288" y="7" width="4" height="236" fill="url(#stitch-v)"/>

    <path d="M12.5 7.5h275v235h-275z" fill="none" stroke="#17120f" stroke-width="2"/>
    <path d="M14.5 9.5h271v231h-271z" fill="none" stroke="#5c4c35" stroke-width="4"/>
    <path d="M14.5 9.5h271v231h-271z" fill="none" stroke="#927d59" stroke-width="2"/>
    <path d="M17 12h266v226H17z" fill="none" stroke="#17120f" stroke-width="1.5"/>

    <path d="M9 7V5h5M291 7V5h-5M9 243v2h5M291 243v2h-5" fill="none" stroke="#c3a978" stroke-width=".7" opacity=".5"/>

    <g transform="translate(0 96)"><use href="#leaf-left"/></g>
    <g transform="translate(300 96) scale(-1 1)"><use href="#leaf-left"/></g>
  </g>
</svg>
