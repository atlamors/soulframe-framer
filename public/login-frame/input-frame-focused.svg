<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 58" role="img" aria-labelledby="title desc">
  <title id="title">Soulframe login input frame, focused state</title>
  <desc id="desc">A narrow amber stitched rail with inner linework and a transparent center.</desc>
  <defs>
    <pattern id="stitch-h" width="5" height="4" patternUnits="userSpaceOnUse">
      <rect width="5" height="4" fill="#17120f"/>
      <path d="M.5.5h3v2.7h-3z" fill="#d69e3a"/>
      <path d="M1 1h2.2v.6H1z" fill="#f1ac40" opacity=".72"/>
    </pattern>
    <pattern id="stitch-v" width="4" height="5" patternUnits="userSpaceOnUse">
      <rect width="4" height="5" fill="#17120f"/>
      <path d="M.5.5h2.7v3h-2.7z" fill="#d69e3a"/>
      <path d="M1 1h.6v2.2H1z" fill="#f1ac40" opacity=".72"/>
    </pattern>
    <filter id="shadow" x="-3%" y="-12%" width="106%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#11100f" flood-opacity=".72"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="7.5" y="1.5" width="417" height="55" rx="3.5" fill="none" stroke="#17120f" stroke-width="2"/>
    <rect x="9.5" y="3.5" width="413" height="51" rx="2" fill="none" stroke="#aa7428" stroke-width="1"/>

    <rect x="9" y="3" width="414" height="4" fill="url(#stitch-h)"/>
    <rect x="9" y="51" width="414" height="4" fill="url(#stitch-h)"/>
    <rect x="8" y="7" width="4" height="44" fill="url(#stitch-v)"/>
    <rect x="420" y="7" width="4" height="44" fill="url(#stitch-v)"/>

    <path d="M12.5 7.5h407v43h-407z" fill="none" stroke="#17120f" stroke-width="2"/>
    <path d="M14.5 9.5h403v39h-403z" fill="none" stroke="#956629" stroke-width="4"/>
    <path d="M14.5 9.5h403v39h-403z" fill="none" stroke="#f1ac40" stroke-width="2"/>
    <path d="M17 12h398v34H17z" fill="none" stroke="#17120f" stroke-width="1.5"/>

    <path d="M9 7V5h5M423 7V5h-5M9 51v2h5M423 51v2h-5" fill="none" stroke="#f1ac40" stroke-width=".7" opacity=".78"/>
  </g>
</svg>
